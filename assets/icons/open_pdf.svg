<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" fill="none">
  <title>Open PDF</title>
  <desc>A printer on a red tile: a blank sheet goes in and a printed page with a peeled corner comes out.</desc>
  <defs>
    <linearGradient id="tile" x1="16" y1="16" x2="240" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EC4257"/>
      <stop offset="1" stop-color="#A9142B"/>
    </linearGradient>
    <linearGradient id="body" x1="48" y1="100" x2="208" y2="176" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D3DCE8"/>
    </linearGradient>
    <linearGradient id="flap" x1="144" y1="186" x2="160" y2="202" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#B4C1D3"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#tile)"/>
  <!-- The blank sheet going in. -->
  <path d="M96 56H160C164.4 56 168 59.6 168 64V108H88V64C88 59.6 91.6 56 96 56Z" fill="#FFFFFF" opacity=".65"/>
  <!-- The printer body, its status light, and its output slot. -->
  <rect x="48" y="106" width="160" height="76" rx="16" fill="#6E0A1B" opacity=".3"/>
  <rect x="48" y="100" width="160" height="76" rx="16" fill="url(#body)"/>
  <circle cx="186" cy="120" r="6" fill="#E5384F"/>
  <rect x="72" y="138" width="112" height="16" rx="8" fill="#7A0D1F"/>
  <!-- The printed page, its corner peeled back. -->
  <path d="M170 184V204C170 208.4 166.4 212 162 212H142Z" fill="#6E0A1B"/>
  <path d="M86 152H170V190L142 218H94C89.6 218 86 214.4 86 210Z" fill="#6E0A1B" opacity=".25"/>
  <path d="M86 146H170V184L142 212H94C89.6 212 86 208.4 86 204Z" fill="#FFFFFF"/>
  <path d="M100 166H156M100 182H140M100 198H126" stroke="#C3CDDB" stroke-width="7" stroke-linecap="round"/>
  <path d="M170 184L142 212V192C142 187.6 145.6 184 150 184Z" fill="url(#flap)"/>
</svg>
