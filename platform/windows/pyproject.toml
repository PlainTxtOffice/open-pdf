#:schema https://json.schemastore.org/pyproject.json

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-pdf"
version = "1.0.0"
description = "Lightweight desktop PDF viewer built with PySide6 and PyMuPDF"
readme = "README.md"
requires-python = ">=3.12"
# The license text is the repository-root LICENSE; PEP 639 license-files
# cannot reach outside this project folder.
license = "MIT"
authors = [{ name = "Tripp", email = "tripp@trippemail.com" }]
dependencies = ["PySide6>=6.7", "PyMuPDF>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.14", "rumdl>=0.0.170", "mypy>=1.18"]

[project.scripts]
open-pdf = "open_pdf.main:main"

[tool.open-pdf]
# Folder name under %LOCALAPPDATA%; keep in sync with APP_DATA_DIR_NAME in
# open_pdf/config/path_handler.py. The Nuitka scripts read this table.
app-data-dir = "open-pdf"

[tool.open-pdf.packaging]
title = "Open PDF"
company-name = "Plain Txt Office"
copyright = "Copyright (c) 2026 Plain Txt Office"

[tool.setuptools]

[tool.setuptools.packages.find]
where = ["."]
include = ["open_pdf", "open_pdf.*"]
namespaces = true

[tool.pytest.ini_options]
addopts = "-s"
testpaths = ["tests"]
pythonpath = ["."]
tmp_path_retention_policy = "none"
cache_dir = "$PYTEST_ACCOUNT_ROOT/cache"

[tool.ruff]
namespace-packages = ["open_pdf/domains", "open_pdf/adapters"]
line-length = 80
# Single source of truth for both the CLI and the editor; the Ruff
# extension's overrides were removed from .vscode/settings.json.
extend-exclude = ["tests"]
# Apply the exclusion when the editor or a hook passes a file directly.
force-exclude = true

[tool.ruff.lint]
# The editor already linted with ALL via its own settings while the CLI
# ran a much narrower default set, which made every editor-driven `noqa`
# look unused to `ruff check .`.
select = ["ALL"]
# D203/D213 are the halves of two mutually exclusive pairs that "ALL" pulls
# in together; naming them here picks the side this codebase already uses and
# silences Ruff's incompatibility warning.
# COM812 fights the Ruff formatter (which manages trailing commas
# itself); enabling both makes `check --fix` and `format` undo each
# other's work.
ignore = ["COM812", "CPY001", "D203", "D213", "DOC201", "DOC501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "ARG001", "ARG005", "INP001", "PLC0415", "PLR2004", "S101", "SLF001"]

[tool.ruff.lint.flake8-import-conventions.extend-aliases]
"decimal.Decimal" = "D"

[tool.mypy]
# Resolve the open_pdf package from the Windows project root.
explicit_package_bases = true
exclude = ['(^|[\\/])tests([\\/]|$)']
ignore_missing_imports = true
disallow_any_explicit = true

[tool.pymarkdown]
extensions.front-matter.enabled = true

[tool.rumdl]
# Match the 80-column wrap used by ruff and the editor.
line-length = 80
exclude = [".venv", "build", "dist"]
# Also covers the ignored paths not listed above, such as .pytest_cache/ and
# logs/, and keeps covering whatever .gitignore gains later.
respect-gitignore = true

[tool.rumdl.MD010]
# Expand tabs to 2 spaces, not the default 4.
spaces-per-tab = 2

[tool.rumdl.MD013]
# Commands and paths inside fenced blocks cannot be wrapped to 80.
code-blocks = false
# Markdown table rows cannot be wrapped without breaking their structure.
tables = false
reflow = true
reflow-mode = "default"

[tool.rumdl.MD029]
style = "one"

[tool.rumdl.MD060]
enabled = true
style = "compact"
