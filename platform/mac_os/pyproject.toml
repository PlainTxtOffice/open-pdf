[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-pdf"
version = "0.1.0"
description = "macOS desktop PDF viewer and light editor"
readme = "README.md"
requires-python = ">=3.12,<3.16"
license = "MIT"
dependencies = ["PySide6>=6.9,<7", "PyMuPDF>=1.26,<2", "keyring>=25.6,<26"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.14", "rumdl>=0.0.170", "mypy>=1.18"]
build = ["pyinstaller>=6.16,<7"]
ocr = ["pytesseract>=0.3.13", "Pillow>=11"]

[project.gui-scripts]
open-pdf = "open_pdf.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["open_pdf", "open_pdf.*"]
namespaces = true

[tool.setuptools.package-data]
open_pdf = ["assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
tmp_path_retention_policy = "none"

[tool.ruff]
namespace-packages = ["open_pdf/domains", "open_pdf/adapters"]
line-length = 80
extend-exclude = ["tests"]
force-exclude = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
explicit_package_bases = true
ignore_missing_imports = true
disallow_any_explicit = true

[tool.rumdl]
line-length = 80
respect-gitignore = true

[tool.rumdl.MD013]
code-blocks = false
tables = false
reflow = true
